services:
  namenode:
    image: hadoop-namenode:latest
    container_name: namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=hadoop-hive-3.4.0
    volumes:
      - hadoop_namenode1:/hadoop/dfs/name
    env_file:
      - settings.env
    ports:
      - "9870:9870" # NameNode 1 UI
      - "9000:9000"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9870"]
      interval: 10s
      timeout: 5s
      retries: 5

  datanode1:
    image: hadoop-datanode:latest
    container_name: datanode1
    hostname: datanode1
    volumes:
      - /mnt/dn1:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    env_file:
      - settings.env
    ports:
      - "9860:9864" # Datanode 1 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9864"]
      interval: 10s
      timeout: 5s
      retries: 5

  datanode2:
    image: hadoop-datanode:latest
    container_name: datanode2
    hostname: datanode2
    volumes:
      - /mnt/dn2:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    env_file:
      - settings.env
    ports:
      - "9861:9864" # Datanode 2 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9864"]
      interval: 10s
      timeout: 5s
      retries: 5

  datanode3:
    image: hadoop-datanode:latest
    container_name: datanode3
    hostname: datanode3
    volumes:
      - /mnt/dn3:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_healthy
    env_file:
      - settings.env
    ports:
      - "9862:9864" # Datanode 3 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9864"]
      interval: 10s
      timeout: 5s
      retries: 5

  resourcemanager:
    image: hadoop-resourcemanager:latest
    container_name: resourcemanager
    hostname: resourcemanager
    depends_on:
      namenode:
        condition: service_healthy
      datanode1:
        condition: service_healthy
      datanode2:
        condition: service_healthy
      datanode3:
        condition: service_healthy
    env_file:
      - settings.env
    ports:
      - "8088:8088" # ResourceManager UI

  nodemanager1:
    image: hadoop-nodemanager:latest
    container_name: nodemanager1
    hostname: nodemanager1
    depends_on:
      namenode:
        condition: service_healthy
      datanode1:
        condition: service_healthy
      resourcemanager:
        condition: service_started
    env_file:
      - settings.env
    ports:
      - "8043:8042" # NodeManager 1 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8042"]
      interval: 10s
      timeout: 5s
      retries: 5

  nodemanager2:
    image: hadoop-nodemanager:latest
    container_name: nodemanager2
    hostname: nodemanager2
    depends_on:
      namenode:
        condition: service_healthy
      datanode2:
        condition: service_healthy
      resourcemanager:
        condition: service_started
    env_file:
      - settings.env
    ports:
      - "8044:8042" # NodeManager 2 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8042"]
      interval: 10s
      timeout: 5s
      retries: 5

  nodemanager3:
    image: hadoop-nodemanager:latest
    container_name: nodemanager3
    hostname: nodemanager3
    depends_on:
      namenode:
        condition: service_healthy
      datanode3:
        condition: service_healthy
      resourcemanager:
        condition: service_started
    env_file:
      - settings.env
    ports:
      - "8045:8042" # NodeManager 3 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8042"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: postgres:13
    container_name: hive-metastore-postgres
    hostname: postgres
    env_file:
      - settings.env
    environment:
      - POSTGRES_DB=hive_metastore
      - POSTGRES_USER=hive_user
      - POSTGRES_PASSWORD=hive_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive_user -d hive_metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-server:
    image: hadoop-hive:latest
    container_name: hive-server
    volumes:
      - hive_volume:/var/lib/postgresql/data
    depends_on:
      namenode:
        condition: service_healthy
      datanode1:
        condition: service_healthy
      datanode2:
        condition: service_healthy
      datanode3:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    env_file:
      - settings.env
    ports:
      - "10002:10002" # HiveServer2 UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 30s
      timeout: 10s
      retries: 5

  spark-jupyter:
    image: spark-yarn:latest
    container_name: spark_jupyter
    hostname: spark
    volumes:
      - ./notebooks:/notebooks
    working_dir: /notebooks
    depends_on:
       - namenode
       - datanode1
       - resourcemanager
       - nodemanager1
    ports:
       - "8888:8888" # Jupyter Notebook for pyspark

volumes:
  postgres_data:
  hive_volume:
  hadoop_namenode1: